[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ael-common"
version = "0.1.1"
description = "Shared data agreement for the Automotive Ethics Lab: state vector spec, action IDs, file formats, validator, and the CATA-200 dataset"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.7"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["ael_common*"]

[tool.setuptools.package-data]
ael_common = ["data/cata_200/*.json"]
